apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cv-workbench
  namespace: cv-shard-training
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: Workbench home
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-csi
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cv-data
  namespace: cv-shard-training
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: Shared training data
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-csi
  resources:
    requests:
      storage: 100Gi
